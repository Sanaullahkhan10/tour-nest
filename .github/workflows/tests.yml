# .github/workflows/tests.yml - runs the tests on GitHub (Ubuntu) for every push and pull request.
# The tests need no database and no secrets.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The workflow may only read the code. It cannot change anything in the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # "npm ci" installs exactly what package-lock.json says.
      - run: npm ci
      - run: npm test